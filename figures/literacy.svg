<text x='5.98' y='14.57' style='font-size: 12.00px; font-weight: bold; font-family: "Arial";' textLength='630.41px' lengthAdjust='spacingAndGlyphs'>In rural KP the literacy gap between men and women is widest at ages 45-49: 57.0% of men vs 10.5% of women</text>
